[package]
name = "SigmaOS-bash-shell"
version = "0.1.0"
edition = "2021"
description = "Bash Shell shell compatibility layer for SigmaOS"
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-bash-shell"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[lib]
name = "bash_shell"
path = "src/lib.rs"

[[bin]]
name = "sigmaos-bash-shell"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
